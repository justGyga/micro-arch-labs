services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway.conf:/etc/nginx/sites-enabled/gateway.conf:ro
    networks:
      - labs-net

networks:
  labs-net:
    external: true